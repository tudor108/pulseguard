apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-inference
  namespace: pulseguard
  labels:
    app: ml-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-inference
  template:
    metadata:
      labels:
        app: ml-inference
    spec:
      serviceAccountName: ml-inference
      containers:
        - name: ml-inference
          image: us-central1-docker.pkg.dev/project-73d1e32a-8e68-4750-93c/pulseguard/ml-inference:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8091
          env:
            - name: MODEL_DIR
              value: /models
            - name: MODEL_VERSION
              value: heuristic-dev
          readinessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: ml-inference
  namespace: pulseguard
spec:
  selector:
    app: ml-inference
  ports:
    - name: http
      port: 8091
      targetPort: 8091


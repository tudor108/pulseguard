apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-generator
  namespace: pulseguard
  labels:
    app: telemetry-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-generator
  template:
    metadata:
      labels:
        app: telemetry-generator
    spec:
      serviceAccountName: telemetry-generator
      containers:
        - name: telemetry-generator
          image: us-central1-docker.pkg.dev/project-73d1e32a-8e68-4750-93c/pulseguard/telemetry-generator:latest
          imagePullPolicy: Always
          args: ["--sink", "pubsub"]
          env:
            - name: GOOGLE_CLOUD_PROJECT
              valueFrom:
                configMapKeyRef:
                  name: pulseguard-platform-config
                  key: GOOGLE_CLOUD_PROJECT
            - name: PUBSUB_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: pulseguard-platform-config
                  key: TELEMETRY_TOPIC
            - name: INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: pulseguard-platform-config
                  key: INTERVAL_SECONDS
            - name: STAFF_PER_DEPARTMENT
              valueFrom:
                configMapKeyRef:
                  name: pulseguard-platform-config
                  key: STAFF_PER_DEPARTMENT
            - name: LOAD_INTENSITY
              valueFrom:
                configMapKeyRef:
                  name: pulseguard-platform-config
                  key: LOAD_INTENSITY
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1"
              memory: "768Mi"

